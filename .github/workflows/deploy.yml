name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint

      # BASE_PATH makes Next prefix every asset URL with /<repo>/, which is where
      # a project page is actually served from. Without it every asset 404s.
      - name: Build the static export
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      # Runs against the exported out/ directory using the same BASE_PATH as the
      # deploy, so a wrong base path fails the build instead of shipping broken.
      - name: Smoke test the exported site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npx playwright test

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
